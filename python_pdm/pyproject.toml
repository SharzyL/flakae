[project]
name = "python_pdm_playground"
version = "0.1.0"
description = "Python playground"
authors = [
    {name = "SharzyL", email = "me@sharzy.in"},
]
dependencies = ["numpy>=2.2.3"]
requires-python = ">=3.12"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.scripts]
python_pdm_playground = "python_pdm_playground:main"

# run with `pdm start`
[tool.pdm.scripts]
start = { call = "python_pdm_playground:main" }

[tool.pdm]
distribution = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
